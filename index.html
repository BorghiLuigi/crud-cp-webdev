<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Jogadoras</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Cadastro de Jogadoras de Futebol Feminino</h1>
        <div class="header_acoes">
            <input type="text" id="busca" placeholder="Buscar por nome ou posição">
            <select id="filtroClube">
                <option value="">Todos os clubes</option>
            </select>
            <button id="ordenarNome">Ordenar por Nome</button>
            <button id="ordenarPosicao">Ordenar por Posição</button>
            <button id="novaJogadora">Nova Jogadora</button>
        </div>
    </header>

    <main>
        <div id="listaJogadoras" class="grid-cards"></div>
    </main>

    <!-- Modal do Formulário -->
    <section id="formSection" class="modal oculto">
        <form id="formJogadora">
            <h2 id="tituloForm">Cadastrar Jogadora</h2>
            <input type="hidden" id="jogadoraId">
            <input type="text" id="nome" placeholder="Nome" required>
            <input type="text" id="posicao" placeholder="Posição" required>
            <input type="text" id="clube" placeholder="Clube" required>
            <input type="text" id="foto" placeholder="Caminho da foto (ex: img/foto.jpg)" required>
            <input type="number" id="gols" placeholder="Gols" min="0" required>
            <input type="number" id="assistencias" placeholder="Assistências" min="0" required>
            <input type="number" id="jogos" placeholder="Jogos" min="0" required>
            <button type="submit">Salvar</button>
            <button type="button" id="cancelar">Cancelar</button>
        </form>
    </section>

    <script src="app.js"></script>
</body>

</html>
